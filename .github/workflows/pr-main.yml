name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  checkDist:
    name: CheckDist
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run build
      - name: Check if generated code is correct
        run: git diff --exit-code dist/
